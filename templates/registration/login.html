{% extends "reconciliation/base.html" %}
{% block title %}Sign in · Freight Audit{% endblock %}

{% block content %}
<div class="login-shell">
  <h1>Sign in</h1>
  <p class="subtitle">Freight invoice auditing</p>

  <div class="card card-pad">
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div class="msg msg-error">Username or password is incorrect.</div>
      {% endif %}
      <div class="field">
        <label for="{{ form.username.id_for_label }}">Username</label>
        <input type="text" name="username" id="{{ form.username.id_for_label }}"
               class="form-input" autofocus required>
      </div>
      <div class="field">
        <label for="{{ form.password.id_for_label }}">Password</label>
        <input type="password" name="password" id="{{ form.password.id_for_label }}"
               class="form-input" required>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
